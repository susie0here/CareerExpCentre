<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>擬真職場體驗館</title>
    <style>
        :root {
            --bg-primary: #fffbf2;
            --bg-card: #fffcf8;
            --bg-card-hover: #f1f5f9;
            --bg-subtle: #f5efe6;
            --accent-blue: #3b82f6;
            --accent-blue-light: #60a5fa;
            --accent-pink: #ec4899;
            --accent-pink-light: #f472b6;
            --accent-yellow: #d97706;
            --accent-yellow-light: #facc15;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 8px rgba(148, 163, 184, 0.08);
            --shadow-md: 0 8px 24px rgba(148, 163, 184, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans CH", sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(255, 253, 253, 0.88);
            backdrop-filter: blur(12px);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .api-key-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.3rem;
            position: relative;
        }

        .api-key-box {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: #f1f5f9;
            padding: 0.3rem 0.6rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .api-key-box input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.8rem;
            outline: none;
            width: 130px;
        }

        .btn-api-submit {
            background: linear-gradient(135deg, var(--accent-blue-light), var(--accent-pink-light));
            color: #ffffff;
            border: none;
            padding: 0.25rem 0.7rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(96, 165, 250, 0.3);
        }

        .btn-api-submit:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }

        .api-status-tag {
            font-size: 0.72rem;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            white-space: nowrap;
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .passport-status {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: #f1f5f9;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .badge-count { color: var(--accent-yellow); font-weight: bold; }

        .container {
            max-width: 1200px;
            margin: 1.8rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .hall-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .hall-header h1 {
            font-size: 1.9rem;
            margin-bottom: 0.4rem;
            background: linear-gradient(135deg, #2563eb, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hall-header p { color: var(--text-muted); font-size: 0.95rem; }

        .filter-tags {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
        }

        .tag-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.45rem 1.1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .tag-btn.active, .tag-btn:hover {
            background: linear-gradient(135deg, #bfdbfe, #fbcfe8);
            color: #1e3a8a;
            font-weight: bold;
            border-color: #93c5fd;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.3rem;
        }

        .room-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.3rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }

        .room-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue-light);
            box-shadow: var(--shadow-md);
            background: #fdfefe;
        }

        .room-type-tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.55rem;
            border-radius: 10px;
            font-weight: bold;
            float: right;
        }

        .type-objective { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .type-llm { background: #fdf2f8; color: #be185d; border: 1px solid #fbcfe8; }

        .room-title { font-size: 1.1rem; font-weight: 700; margin: 0.5rem 0 0.3rem 0; color: var(--text-main); }
        .room-roles { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 0.8rem; line-height: 1.3; }
        .room-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            border-top: 1px solid var(--border-color);
            padding-top: 0.7rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .room-view {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.8rem;
            animation: fadeIn 0.3s ease;
            box-shadow: var(--shadow-md);
        }

        .btn-back {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            transition: all 0.2s;
        }

        .btn-back:hover { color: var(--text-main); border-color: #cbd5e1; background: #e2e8f0; }

        .npc-stage {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            background: #f8fafc;
            padding: 1.1rem 1.3rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 1.3rem;
        }

        .npc-avatar-box {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #eff6ff, #fdf2f8);
            border: 2px solid var(--accent-blue-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .npc-avatar-box svg { width: 100%; height: 100%; }
        .npc-name { font-weight: bold; color: var(--accent-blue); font-size: 0.98rem; }
        .npc-title-tag { font-size: 0.75rem; color: #be185d; background: #fdf2f8; border: 1px solid #fbcfe8; padding: 0.1rem 0.5rem; border-radius: 4px; margin-left: 0.4rem; }
        .npc-text { font-size: 0.92rem; color: var(--text-main); margin-top: 0.3rem; line-height: 1.4; }

        .workspace-panel {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.3rem;
        }

        .task-title { font-size: 1.1rem; font-weight: bold; color: #b45309; margin-bottom: 0.4rem; }
        .task-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.55; margin-bottom: 1.2rem; }

        .excel-table-sim {
            width: 100%;
            border-collapse: collapse;
            font-family: monospace;
            font-size: 0.88rem;
            margin-bottom: 1.2rem;
            background: #ffffff;
            box-shadow: var(--shadow-sm);
        }

        .excel-table-sim th, .excel-table-sim td {
            border: 1px solid var(--border-color);
            padding: 0.6rem;
            text-align: center;
        }

        .excel-table-sim th { background: #f1f5f9; color: var(--accent-blue); font-weight: bold; }
        .excel-table-sim input {
            background: #ffffff;
            border: 1px solid var(--accent-blue-light);
            color: #047857;
            padding: 0.35rem;
            width: 100%;
            font-family: monospace;
            font-weight: bold;
            text-align: center;
            border-radius: 4px;
        }

        .terminal-box {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            color: #38bdf8;
            margin-bottom: 1.2rem;
            box-shadow: var(--shadow-sm);
        }

        .input-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .input-field {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: var(--text-main);
            padding: 0.7rem 0.85rem;
            border-radius: 8px;
            font-size: 0.88rem;
            outline: none;
            width: 100%;
            transition: all 0.2s;
        }

        textarea.input-field { resize: vertical; min-height: 90px; line-height: 1.5; }
        .input-field:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

        .btn-action {
            background: linear-gradient(135deg, var(--accent-blue-light), var(--accent-pink-light));
            color: #ffffff;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
            box-shadow: 0 4px 14px rgba(96, 165, 250, 0.35);
        }

        .btn-action:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(244, 114, 182, 0.35);
        }

        .result-container {
            display: none;
            margin-top: 1.3rem;
            flex-direction: column;
            gap: 0.9rem;
            animation: fadeIn 0.4s ease;
        }

        .objective-badge {
            padding: 1rem 1.3rem;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.93rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            line-height: 1.5;
        }

        .badge-success {
            background: #ecfdf5;
            color: #047857;
            border: 1.5px solid #a7f3d0;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.08);
        }

        .badge-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1.5px solid #fecaca;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.08);
        }

        .analysis-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 1.1rem;
            border-left: 5px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .analysis-card.pros { border-left-color: var(--accent-green); background: #f0fdf4; }
        .analysis-card.cons { border-left-color: var(--accent-yellow); background: #fffbeb; }
        .analysis-card.advice { border-left-color: var(--accent-blue); background: #eff6ff; }

        .card-header { font-weight: bold; font-size: 0.9rem; margin-bottom: 0.4rem; }
        .pros .card-header { color: #047857; }
        .cons .card-header { color: #b45309; }
        .advice .card-header { color: #1d4ed8; }

        .card-content { font-size: 0.88rem; color: var(--text-main); line-height: 1.55; white-space: pre-line; }

        .loading-spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span></span> 擬真職場體驗館
        </div>
        <div class="header-controls">
            <!-- API Key 頂欄提交區 -->
            <div class="api-key-container">
                <div class="api-key-box">
                    <span style="font-size: 0.75rem; color: var(--text-muted);">API Key:</span>
                    <input type="password" id="api-key-input" placeholder="可輸入 Gemini Key">
                    <button type="button" id="btn-verify-key" class="btn-api-submit" onclick="verifyApiKey()">提交</button>
                </div>
                <!-- 驗證狀態顯示 (綠色成功 / 紅色失敗) -->
                <div id="api-key-status" class="api-status-tag" style="display:none;"></div>
            </div>

            <div class="passport-status">
                <span style="font-size: 0.85rem; color: var(--text-muted);">完成任務：</span>
                <span class="badge-count" id="badge-count">0 / 16</span>
            </div>
        </div>
    </header>

    <div class="container">
        
        <div id="hall-view">
            <div class="hall-header">
                <h1>具體職業．具體實戰體驗</h1>
                <p>硬實力精確判斷對錯 ╳ 軟實力 LLM 導師評估，還原真實職場日常</p>
            </div>

            <div class="filter-tags">
                <button class="tag-btn active" onclick="filterCategory('all')">全部展館 (16)</button>
                <button class="tag-btn" onclick="filterCategory('tech')">科技 / AI / 數據</button>
                <button class="tag-btn" onclick="filterCategory('biz')">商管 / 金融 / 行銷</button>
                <button class="tag-btn" onclick="filterCategory('service')">服務 / 醫療 / 教育</button>
                <button class="tag-btn" onclick="filterCategory('trade')">物流 / 工程 / 永續</button>
            </div>

            <div class="rooms-grid" id="rooms-grid"></div>
        </div>

        <div id="room-view" class="room-view">
            <button class="btn-back" onclick="backToHall()">← 返回大廳選單</button>
            
            <div class="npc-stage">
                <div class="npc-avatar-box" id="npc-avatar"></div>
                <div>
                    <div>
                        <span class="npc-name" id="npc-name">導師姓名</span>
                        <span class="npc-title-tag" id="npc-role-tag">職涯導師</span>
                    </div>
                    <div class="npc-text" id="npc-text">歡迎來到本館！</div>
                </div>
            </div>

            <div class="workspace-panel">
                <div class="task-title" id="task-title">任務名稱</div>
                <div class="task-desc" id="task-desc">任務說明...</div>

                <div id="form-workspace"></div>

                <!-- 展館任務提交按鈕 -->
                <button class="btn-action" id="btn-submit" onclick="submitTask()">
                    <span id="btn-text">提交任務驗證</span>
                    <span id="btn-spinner" class="loading-spinner" style="display:none;"></span>
                </button>

                <!-- 展館結果反饋容器 -->
                <div class="result-container" id="result-container"></div>
            </div>
        </div>

    </div>

    <script>
        // 全域已保存的有效 API Key
        let globalVerifiedApiKey = "";

        // API Key 頂欄提交與驗證邏輯
        async function verifyApiKey() {
            const input = document.getElementById('api-key-input');
            const btn = document.getElementById('btn-verify-key');
            const statusTag = document.getElementById('api-key-status');
            const val = input.value.trim();

            if (!val) {
                statusTag.style.display = 'block';
                statusTag.className = 'api-status-tag badge-error';
                statusTag.innerText = '✗ 請輸入 API Key 後再提交！';
                return;
            }

            btn.disabled = true;
            btn.innerText = "連線中...";
            statusTag.style.display = 'none';

            try {
                // 使用 Google Models API 端點發起輕量級測試請求
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${val}`);
                
                if (response.ok) {
                    globalVerifiedApiKey = val;
                    input.value = "";
                    statusTag.style.display = 'block';
                    statusTag.className = 'api-status-tag badge-success';
                    statusTag.innerText = '✓ API Key 連線成功並已保存！';
                } else {
                    const errData = await response.json().catch(() => ({}));
                    const errMsg = errData.error?.message || `HTTP ${response.status} (${response.statusText})`;
                    statusTag.style.display = 'block';
                    statusTag.className = 'api-status-tag badge-error';
                    statusTag.innerText = `✗ 連線失敗: ${errMsg}`;
                }
            } catch (err) {
                statusTag.style.display = 'block';
                statusTag.className = 'api-status-tag badge-error';
                statusTag.innerText = `✗ 網路連線異常: ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "提交";
            }
        }

                        <textarea id="input_1" class="input-field" placeholder="範疇一：車隊電動化... 範疇三：綠色供應鏈審核與遠距辦公..."></textarea>
                    </div>
                `
            },
            {
                id: "15", category: "tech", type: "llm", title: "數位轉型", roles: "變革管理顧問",
                npcName: "轉型顧問 Leo", avatarType: "digital",
                taskName: "傳統企業員工抗拒新系統之變革管理",
                desc: "傳統老牌企業導入全新 CRM 系統，資深員工因習慣舊 Excel 流程而強烈排斥。請運用 ADKAR 變革模型寫出您的溝通與輔導步驟。",
                render: () => `
                    <div class="input-group">
                        <label>變革管理溝通與激勵機制：</label>
                        <textarea id="input_1" class="input-field" placeholder="寫下認知建立 (Awareness)、誘因設計 (Desire) 與種子教練培訓..."></textarea>
                    </div>
                `
            },
            {
                id: "16", category: "trade", type: "objective", title: "工程與工業安全", roles: "廠務工程師、安衛主管",
                npcName: "總工程師 師傅", avatarType: "engineer",
                taskName: "電氣設備維修上鎖掛牌 (LOTO) 安全工序排序",
                desc: "請將下列 LOTO (Lockout/Tagout) 斷電安全維修步驟，按正確先後順序填入（填寫步驟代碼，如: B->A->C）：<br>A. 切斷主電源開關<br>B. 通知受影響的作業人員<br>C. 上鎖並掛上警示牌<br>D. 進行零能量驗證（測試是否殘留電壓）",
                render: () => `
                    <div class="input-group">
                        <label>請寫出正確的工序順序 (例如: B->A->C->D)：</label>
                        <input id="input_1" class="input-field" placeholder="字母順序，用箭頭或逗號分隔">
                    </div>
                `,
                checkAnswer: (inputs) => {
                    const seq = inputs[0].value.trim().toUpperCase().replace(/[^A-D]/g, '');
                    if (seq === "BACD") {
                        return { pass: true, msg: "安規工序完全正確！1.通知人員(B) -> 2.切斷電源(A) -> 3.上鎖掛牌(C) -> 4.驗證零能量(D)。" };
                    }
                    return { pass: false, msg: `安規工序有誤！\n- 正確順序：BACD (通知 -> 斷電 -> 上鎖 -> 測試零能量)\n- 錯誤原因：切勿在未通知時切斷電源，也絕不能未驗電就開始作業！` };
                }
            }
        ];

        let currentRoom = null;
        let completedRooms = new Set();

        document.addEventListener('DOMContentLoaded', () => {
            renderRooms('all');
        });

        function renderRooms(cat) {
            const grid = document.getElementById('rooms-grid');
            grid.innerHTML = '';
            const filtered = cat === 'all' ? ROOMS_DATA : ROOMS_DATA.filter(r => r.category === cat);

            filtered.forEach(room => {
                const card = document.createElement('div');
                card.className = 'room-card';
                card.onclick = () => openRoom(room.id);

                const typeBadge = room.type === 'objective' 
                    ? `<span class="room-type-tag type-objective">硬實力精確判斷</span>`
                    : `<span class="room-type-tag type-llm">軟實力 LLM 評估</span>`;

                card.innerHTML = `
                    <div>
                        <div>
                            <span style="font-size:0.75rem; color:var(--accent-blue); font-weight:bold;">展館 ${room.id}</span>
                            ${typeBadge}
                        </div>
                        <div class="room-title">${room.title}</div>
                        <div class="room-roles">${room.roles}</div>
                    </div>
                    <div class="room-footer">
                        <span>進入實戰 →</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderRooms(cat);
        }

        function openRoom(roomId) {
            currentRoom = ROOMS_DATA.find(r => r.id === roomId);

            document.getElementById('hall-view').style.display = 'none';
            document.getElementById('room-view').style.display = 'block';

            document.getElementById('npc-avatar').innerHTML = getCartoonAvatarSvg(currentRoom.avatarType);
            document.getElementById('npc-name').innerText = currentRoom.npcName;
            document.getElementById('npc-role-tag').innerText = `展館 ${currentRoom.id} 導師`;
            document.getElementById('npc-text').innerText = `「我是【${currentRoom.title}】的${currentRoom.npcName}。準備好接受今天的實戰考驗了嗎？」`;

            document.getElementById('task-title').innerText = currentRoom.taskName;
            document.getElementById('task-desc').innerHTML = currentRoom.desc;
            document.getElementById('result-container').style.display = 'none';

            const workspace = document.getElementById('form-workspace');
            workspace.innerHTML = currentRoom.render();

            const btnText = document.getElementById('btn-text');
            btnText.innerText = currentRoom.type === 'objective' ? "提交即時驗證" : "提交給導師進行深度評估";
        }

        async function submitTask() {
            const inputs = document.querySelectorAll('#form-workspace input, #form-workspace textarea, #form-workspace select');
            let hasValue = false;
            inputs.forEach(i => { if (i.value.trim()) hasValue = true; });

            const resBox = document.getElementById('result-container');
            resBox.innerHTML = '';
            resBox.style.display = 'flex';

            if (!hasValue) {
                resBox.innerHTML = `
                    <div class="objective-badge badge-error">
                        <span>✗ [提交失敗]</span>
                        <span>請先填寫答案或處置方案！</span>
                    </div>
                `;
                return;
            }

            if (currentRoom.type === 'objective') {
                const result = currentRoom.checkAnswer(inputs);
                
                if (result.pass) {
                    inputs.forEach(i => i.value = '');
                    resBox.innerHTML = `
                        <div class="objective-badge badge-success">
                            <span>✓ [驗證成功]</span>
                            <span>${result.msg}</span>
                        </div>
                    `;
                    completedRooms.add(currentRoom.id);
                    document.getElementById('badge-count').innerText = `${completedRooms.size} / 16`;
                } else {
                    resBox.innerHTML = `
                        <div class="objective-badge badge-error">
                            <span>✗ [驗證失敗]</span>
                            <div style="margin-top:0.3rem; white-space:pre-line;">${result.msg}</div>
                        </div>
                    `;
                }
            } else {
                const userAns = inputs[0].value.trim();
                const apiKey = globalVerifiedApiKey || document.getElementById('api-key-input').value.trim();
                const btnText = document.getElementById('btn-text');
                const btnSpinner = document.getElementById('btn-spinner');

                btnText.innerText = "導師評估中...";
                btnSpinner.style.display = "inline-block";

                try {
                    let analysis = null;
                    if (apiKey) {
                        analysis = await fetchGeminiAnalysis(apiKey, currentRoom, userAns);
                    } else {
                        analysis = await simulateLLMAnalysis(currentRoom, userAns);
                    }

                    inputs.forEach(i => i.value = '');
                    resBox.innerHTML = `
                        <div class="objective-badge badge-success" style="margin-bottom:0.5rem;">
                            <span>✓ [提交成功]</span>
                            <span>導師評估完成！以下為您的處置方案評估報告：</span>
                        </div>
                        <div class="analysis-card pros">
                            <div class="card-header">利處與優勢 (Pros)</div>
                            <div class="card-content">${analysis.pros}</div>
                        </div>
                        <div class="analysis-card cons">
                            <div class="card-header">潛在風險與盲點 (Cons)</div>
                            <div class="card-content">${analysis.cons}</div>
                        </div>
                        <div class="analysis-card advice">
                            <div class="card-header">資深人士建議 (Senior Advice)</div>
                            <div class="card-content">${analysis.advice}\n\n【背後原理】\n${analysis.reason}</div>
                        </div>
                    `;

                    completedRooms.add(currentRoom.id);
                    document.getElementById('badge-count').innerText = `${completedRooms.size} / 16`;

                } catch (e) {
                    resBox.innerHTML = `
                        <div class="objective-badge badge-error">
                            <span>✗ [API 調用失敗 / 評估失敗]</span>
                            <div style="margin-top:0.3rem; line-height:1.4;">${e.message}</div>
                        </div>
                    `;
                } finally {
                    btnText.innerText = "提交任務驗證";
                    btnSpinner.style.display = "none";
                }
            }
        }

        async function fetchGeminiAnalysis(apiKey, room, userAns) {
            const prompt = `你現在是【${room.title}】的資深專家（${room.npcName}）。
情境任務：${room.taskName}
使用者的處置方案："${userAns}"

請針對使用者的回答進行客觀點評，必須輸出嚴格的 JSON 格式，繁體中文回答，結構如下：
{
  "pros": "列出此作法的優點與優勢",
  "cons": "列出此作法潛在風險或執行漏洞",
  "advice": "資深人士優化建議",
  "reason": "經驗理由與行業心法"
}`;

            // 優先調用 Gemini 3.5 Flash
            const modelsToTry = ["gemini-3.5-flash", "gemini-2.5-flash", "gemini-1.5-flash"];
            let lastErrorMsg = "";

            for (const model of modelsToTry) {
                try {
                    const endpoint = `[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){model}:generateContent?key=${apiKey}`;
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (!rawText) throw new Error("API 未傳回有效分析內容。");
                        return JSON.parse(rawText.replace(/```json/gi, '').replace(/```/g, '').trim());
                    }

                    const errData = await response.json().catch(() => ({}));
                    const errMsg = errData.error?.message || `HTTP ${response.status} (${response.statusText})`;
                    lastErrorMsg = `[模型 ${model}] ${errMsg}`;

                    if (response.status === 400 || response.status === 403) {
                        throw new Error(`API 金鑰無效或無存取權限: ${errMsg}`);
                    }
                } catch (err) {
                    if (err.message.includes("API 金鑰無效")) throw err;
                    lastErrorMsg = err.message;
                }
            }

            throw new Error(`調用失敗：${lastErrorMsg}。請檢查 API Key 是否正確或具備該模型存取權限。`);
        }

        function simulateLLMAnalysis(room, userAns) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve({
                        pros: `1. 核心方向明確：針對【${room.taskName}】提出了「${userAns.slice(0, 15)}...」的處置邏輯。\n2. 具備良好前線應變與戰略意識。`,
                        cons: `1. 執行細節風險：在實際職場中若未考量跨部門權責與時間線，可能引發執行阻力。\n2. 建議增設風險預警備案。`,
                        advice: `資深導師點評：建議在執行此方案時，同步附上「資源清單與明確 KPI」，能大幅增加可信度。`,
                        reason: `資深職場經驗顯示：好的策略不僅要解決問題，更要降低合作對象與主管的不確定感。`
                    });
                }, 800);
            });
        }

        function backToHall() {
            document.getElementById('room-view').style.display = 'none';
            document.getElementById('hall-view').style.display = 'block';
        }
    </script>
